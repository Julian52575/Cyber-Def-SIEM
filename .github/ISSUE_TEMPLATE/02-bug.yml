name: Bug
description: Incorrect behaviour in existing functionality
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: checkboxes
    attributes:
      label: Pre-submit
      options:
        - label: I searched open and closed issues and this is not a duplicate
          required: true
        - label: I can reproduce this on the latest `main`
          required: true

  - type: textarea
    attributes:
      label: What's wrong
      description: The incorrect behaviour, in one or two sentences.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to reproduce
      description: Numbered, starting from a clean checkout.
      placeholder: |
        1. just sync
        2. just run ...
        3. ...
    validations:
      required: true

  - type: textarea
    attributes:
      label: Expected vs actual
    validations:
      required: true

  - type: textarea
    attributes:
      label: Environment
      description: Output of `git rev-parse HEAD`, `uv --version` and `uv run python --version`, plus your OS.
      render: shell
    validations:
      required: true

  - type: textarea
    attributes:
      label: Logs
      description: Relevant output -- `just logs`, a CI run link, a stack trace.
      render: shell
    validations:
      required: false
