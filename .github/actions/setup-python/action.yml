name: setup-python
description: >
  Install uv, Python and just, then sync the locked dependencies (dev group
  included) into .venv, so later steps can call `just ...` or `uv run ...`.

  The caller MUST run actions/checkout before this action -- a composite
  action referenced by local path (./.github/actions/...) cannot check out
  the repository it lives in.

runs:
  using: composite
  steps:
    # Python comes from `requires-python` in pyproject.toml; uv downloads it.
    - name: Install uv
      uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock

    - name: Install just
      uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      with:
        just-version: "1.59.0"

    # --locked fails if uv.lock is out of date with pyproject.toml.
    - name: Sync dependencies
      shell: bash
      run: uv sync --locked
