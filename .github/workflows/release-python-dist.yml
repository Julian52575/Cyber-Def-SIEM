name: release-python-dist

# Builds the sdist and wheel with uv, attests their build provenance
# (Sigstore OIDC, no key to manage) and attaches them to the GitHub Release.
#
#   release created     -> files attached to that release
#   workflow_dispatch   -> files uploaded as a workflow artifact only
#
# Verify: gh attestation verify my_siem-<version>-py3-none-any.whl --repo <owner>/<repo>

on:
  release:
    types: [created]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # attach files to the release
      id-token: write # keyless provenance signing (OIDC)
      attestations: write
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-python # zizmor: ignore[self-repository] -- actionlint rejects `$/`

      - name: Build the sdist and wheel
        run: uv build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber

      - name: Upload as a workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
