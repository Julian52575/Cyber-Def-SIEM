name: ci-sast

# Static Application Security Testing with CodeQL (Python, JS/TS + workflows).
#
#   guard            nothing runs on a draft or fork PR.
#   codeql           scans, writes a summary, and fails on any error-severity
#                    alert. Nothing is uploaded to code scanning, so no Advanced
#                    Security is needed.
#   ci-sast-required single stable check to add to the branch ruleset once the
#                    team relies on it.

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - ".gitignore"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/rulesets/**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - id: check
        env:
          IS_FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          IS_DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: |
          run=true
          if [[ $IS_FORK == true ]]; then
            run=false; echo "Fork pull request -- SAST skipped."
          elif [[ $IS_DRAFT == true ]]; then
            run=false; echo "Draft pull request -- SAST runs once the PR is marked ready."
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  codeql:
    name: CodeQL
    needs: [guard]
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: actions, python, javascript-typescript
          build-mode: none
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          # Set `upload: always` (and `security-events: write`) to also publish
          # to the Security tab.
          output: codeql-results
          upload: never

      # A result's level falls back to its rule's default level, which is where
      # CodeQL usually records it.
      - name: Summarize and enforce the gate
        run: |
          set -euo pipefail
          jq -rs '
            [ .[].runs[] | (.tool.driver.rules // []) as $rules | .results[]?
              | { level: (.level // $rules[.rule.index // .ruleIndex // -1].defaultConfiguration.level // "warning"),
                  rule: .ruleId,
                  loc: (.locations[0].physicalLocation | "\(.artifactLocation.uri):\(.region.startLine // 0)"),
                  msg: (.message.text | gsub("[\r\n|]+"; " ")) } ]
            | .[] | [.level, .rule, .loc, .msg] | @tsv' codeql-results/*.sarif > codeql-results/rows.tsv

          errors=$(awk -F'\t' '$1 == "error"' codeql-results/rows.tsv | wc -l)
          total=$(wc -l < codeql-results/rows.tsv)
          {
            echo "### CodeQL: ${errors} error / ${total} total"
            echo
            echo "**Gate:** any error-severity alert fails."
            echo
            echo "| Level | Rule | Location | Message |"
            echo "| --- | --- | --- | --- |"
            awk -F'\t' '{ printf "| %s | `%s` | `%s` | %s |\n", $1, $2, $3, $4 }' codeql-results/rows.tsv
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$errors" -gt 0 ]; then
            echo "::error::CodeQL found ${errors} error-severity alerts -- see the job summary"
            exit 1
          fi

      - name: Upload the SARIF
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-results
          path: codeql-results
          if-no-files-found: ignore

  # Passes when every needed job succeeded or was skipped (draft/fork PRs);
  # fails on failure/cancelled.
  ci-sast-required:
    if: always()
    needs: [guard, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Every required job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          if printf '%s\n' "$RESULTS" | grep -Eqw 'failure|cancelled'; then
            echo "a required job did not succeed: $RESULTS"
            exit 1
          fi
